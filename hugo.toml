baseURL = "https://biaozyx.pages.dev/"
theme = "LoveIt"
title = "Zivon's Campsite"
defaultContentLanguage = "zh-cn"
languageCode = "zh-CN"
languageName = "简体中文"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "文章"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "标签"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "分类"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "about"
    name = "关于"
    url = "/about/"

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "Zivon's Campsite"
  description = "在互联网的角落留下一些痕迹"

  [params.author]
    name = "Zivon Xue"
    avatar = "/images/logo_Z.svg"
    email = "BiaoZyx@outlook.com"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "Zivon's Campsite"
      pre = ""
      post = ""
      typeit = false

  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2025
    license = ""

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    title = "Zivon's Campsite"
    noFavicon = false
    svgFavicon = "/images/logo_Z.svg"
    themeColor = "#ffffff"

  # 搜索 —— 用 fuse，本地索引，不依赖任何外部服务
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = "搜索"
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/logo_Z.svg"
      title = "Hi, there! 👋"
      subtitle = "在互联网的角落留下一些痕迹"
      typeit = true                 # ← 打字机动画
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 6

  [params.social]
    GitHub = "BiaoZyx"
    Email = "mailto:BiaoZyx@outlook.com"
    RSS = true

  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = false
    linkToMarkdown = false
    rssFullText = false
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
      maxShownLines = 50
      [params.page.code.render]
        goat = true
        mermaid = false
    [params.page.math]
      enable = true
    [params.page.share]
      enable = true
      X = false
      Facebook = false
      Linkedin = false
      Weibo = true
      Telegram = false
      HackerNews = false
      Line = false
      Diaspora = false
      Threads = false
    [params.page.comment]
      enable = true
      [params.page.comment.giscus]
        enable = true
        repo = "BiaoZyx/cloudflare-pages"
        repoId = "R_kgDOTD_zJQ"
        category = "Announcements"
        categoryId = "DIC_kwDOTD_zJc4DI0wN"
        mapping = "pathname"
        lang = "zh-CN"
        reactionsEnabled = "1"
        emitMetadata = "0"
        inputPosition = "bottom"
        lazyLoading = false
        lightTheme = "light"
        darkTheme = "dark_dimmed"
    [params.page.seo]
      images = []
      [params.page.seo.publisher]
        name = "Zivon Xue"
        logoUrl = "/images/logo_Z.svg"

  [params.typeit]
    speed = 100
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1

  [params.cdn]
    data = ""               # 留空即不用 CDN

  [params.compatibility]
    polyfill = false
    objectFit = false

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  posts = ":contentbasename"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
